<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a Hand Riveter Works</title>
<style>
  html, body { margin: 0; height: 100%; background: #fdf6e3; overflow: hidden; }
  body { font-family: "Chalkboard SE", "Comic Sans MS", "Comic Neue", system-ui, sans-serif; }
  svg { display: block; width: 100vw; height: 100vh; touch-action: none; }
  text { user-select: none; -webkit-user-select: none; }
  .btn { cursor: pointer; }
  .btn:hover > rect, .btn:hover > circle { filter: brightness(1.12); }
  #bigHandle { cursor: grab; }
  #bigHandle:active { cursor: grabbing; }
  .ptitle { font-size: 22px; font-weight: bold; }
  .msg { box-sizing: border-box; height: 100%; display: flex; align-items: center; gap: 20px;
         padding: 0 26px; background: #fff; border: 5px solid #94a3b8; border-radius: 20px;
         font-size: 25px; line-height: 1.25; color: #1e293b; transition: border-color .3s; }
  .msg .emo { font-size: 46px; }
</style>
</head>
<body>
<svg id="svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <pattern id="pCut" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#f87171"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ef4444" stroke-width="6"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="d"/>
      <feGaussianBlur in="d" stdDeviation="5" result="b"/>
      <feFlood flood-color="#facc15"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <clipPath id="jobClip"><rect x="30" y="70" width="1000" height="350" rx="22"/></clipPath>
    <clipPath id="zoomClip"><rect x="32" y="484" width="1536" height="314" rx="18"/></clipPath>
  </defs>

  <text x="800" y="48" text-anchor="middle" font-size="36" font-weight="bold" fill="#1e293b">How does a HAND RIVETER work?</text>

  <!-- ================= THE JOB ================= -->
  <rect x="30" y="70" width="1000" height="350" rx="22" fill="url(#wall)"/>
  <g clip-path="url(#jobClip)">
    <!-- a closed metal box, cut open so we can see inside -->
    <rect x="716" y="128" width="266" height="264" fill="#1e293b"/>
    <text x="850" y="232" text-anchor="middle" font-size="44">🙈</text>
    <text x="850" y="276" text-anchor="middle" font-size="19" font-weight="bold" fill="#e2e8f0">INSIDE A CLOSED BOX</text>
    <text x="850" y="300" text-anchor="middle" font-size="16" fill="#cbd5e1">no hand can reach in here</text>
    <rect x="700" y="120" width="290" height="8" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="700" y="392" width="290" height="8" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <rect x="982" y="120" width="8" height="280" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <g fill="#93c5fd" stroke="#1e3a8a" stroke-width="1.5">
      <rect x="700" y="120" width="8" height="111"/>
      <rect x="700" y="259" width="8" height="26"/>
    </g>
    <g id="plateB" fill="#86efac" stroke="#166534" stroke-width="1.5">
      <rect x="708" y="205" width="8" height="26"/>
      <rect x="708" y="259" width="8" height="141"/>
    </g>
    <g id="tiny"></g>
    <circle cx="712" cy="245" r="50" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 6"/>
    <line x1="712" y1="295" x2="712" y2="436" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="724" y="414" font-size="15" font-weight="bold" fill="#4f46e5">🔍 zoomed in below</text>

    <!-- the hand riveter (side view), nose tip at 0,0 -->
    <g id="bigTool">
      <line x1="-195" y1="20" x2="-262" y2="160" stroke="#dc2626" stroke-width="26" stroke-linecap="round"/>
      <line x1="-234" y1="102" x2="-262" y2="160" stroke="#1f2937" stroke-width="32" stroke-linecap="round"/>
      <rect x="-238" y="-28" width="200" height="56" rx="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="3"/>
      <text x="-140" y="7" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">RIVETER</text>
      <rect x="-42" y="-9" width="42" height="18" rx="3" fill="#64748b" stroke="#1e293b" stroke-width="2"/>
      <g id="bigHandle">
        <line x1="-70" y1="20" x2="-125" y2="160" stroke="transparent" stroke-width="70" stroke-linecap="round"/>
        <line x1="-70" y1="20" x2="-125" y2="160" stroke="#dc2626" stroke-width="22" stroke-linecap="round"/>
        <line x1="-102" y1="100" x2="-125" y2="160" stroke="#1f2937" stroke-width="30" stroke-linecap="round"/>
      </g>
      <circle cx="-70" cy="20" r="9" fill="#e2e8f0" stroke="#1e293b" stroke-width="2.5"/>
    </g>
    <text id="bigPop" text-anchor="middle" font-size="30" font-weight="bold" fill="#dc2626" stroke="#fff" stroke-width="5" paint-order="stroke" opacity="0">SNAP!</text>
  </g>
  <rect x="30" y="70" width="1000" height="350" rx="22" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="52" y="104" class="ptitle" fill="#334155">THE JOB</text>
  <text id="status" x="52" y="136" font-size="20" fill="#334155">Rivet: not in the hole yet</text>
  <text x="52" y="172" font-size="17" fill="#475569">✋ OUTSIDE: your hand can reach here</text>
  <text x="52" y="198" font-size="17" fill="#475569">Drag the black handle to squeeze! ⤵</text>

  <!-- ================= WHAT TO DO ================= -->
  <rect x="1050" y="70" width="520" height="350" rx="22" fill="#fff" stroke="#ef4444" stroke-width="3"/>
  <text x="1072" y="102" class="ptitle" fill="#dc2626">WHAT TO DO</text>
  <g id="steps"></g>
  <g class="btn" id="mainBtn"><rect id="mainRect" x="1072" y="298" width="476" height="54" rx="14" fill="#eab308"/>
    <text id="mainText" x="1310" y="334" text-anchor="middle" font-size="25" font-weight="bold" fill="#fff"></text></g>
  <text x="1072" y="381" font-size="15" font-weight="bold" fill="#475569">HOW HARD THE STEM IS PULLED</text>
  <text id="sqCount" x="1548" y="381" text-anchor="end" font-size="15" font-weight="bold" fill="#475569">squeezes: 0</text>
  <rect x="1072" y="390" width="400" height="20" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <rect id="forceBar" x="1072" y="390" width="0" height="20" rx="10" fill="#22c55e"/>
  <line x1="1472" y1="384" x2="1472" y2="416" stroke="#dc2626" stroke-width="3"/>
  <text x="1480" y="406" font-size="15" font-weight="bold" fill="#dc2626">💥 snap</text>

  <!-- ================= ZOOM ================= -->
  <rect x="30" y="435" width="1540" height="365" rx="22" fill="#fff" stroke="#6366f1" stroke-width="3"/>
  <text x="52" y="466" class="ptitle" fill="#4f46e5">ZOOM IN <tspan font-size="16" font-weight="normal">(x-ray: everything cut in half)</tspan></text>
  <g id="legend"></g>
  <g class="btn" id="slowBtn"><rect id="slowRect" x="1104" y="446" width="130" height="34" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text id="slowText" x="1169" y="469" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">🐢 slow-mo</text></g>
  <g class="btn" id="wiggleBtn"><rect x="1242" y="446" width="150" height="34" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="1317" y="469" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">🤝 wiggle test</text></g>
  <g class="btn" id="resetBtn"><rect x="1400" y="446" width="156" height="34" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/><text x="1478" y="469" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">↺ start again</text></g>
  <g id="zoom" clip-path="url(#zoomClip)"></g>

  <!-- explanation -->
  <foreignObject x="30" y="812" width="1540" height="80">
    <div class="msg" id="msg"><span class="emo" id="msgEmo"></span><span id="msgText"></span></div>
  </foreignObject>
</svg>

<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < 0.5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t);
const f1 = v => v.toFixed(1);

// ---------- joint geometry (zoom view, in px; the rivet lies along y = CY) ----------
const CY = 632;
const BORE = 22, RO = 50, FLR = 100;                     // rivet hole, outside, head
const BALL = 34, STEM = 18, NECK = 9;                     // stem: ball end, thickness, thin neck
const FL0 = 736, FS0 = 760, FS1 = 790, SHW = 30;          // rivet head, front sheet, sheet thickness
const HOLE = 52, SH_T = 490, SH_B = 775;
const G0 = 26;                                            // gap between the loose sheets
const TAIL0 = 154;                                        // tail sticking out past the back sheet
const XT0 = FS1 + G0 + SHW + TAIL0;                       // tail end before pulling
const HX0 = XT0 + 28, NECK_X = HX0 - 38, STEM_L = 406;    // ball centre, break point, stem end
// how far the stem is pulled in each stage: ball goes in, bulb forms, gap closes, last bit
const TAIL1 = 70, TAIL2 = 56;                             // tail length once the bulb is formed / when it snaps
const E = 20, A = TAIL0 - TAIL1, T = TAIL1 - TAIL2, PSNAP = E + A + G0 + T;
const STROKE = 60;                                        // jaw travel per full squeeze
const INS = 320, TOOL_OFF = 820;                          // slide-in distances
const TS = 8 / SHW;                                       // top picture scale

const bump = t => Math.sin(Math.PI * Math.pow(t, 0.65));
// the squashed tail bunches up into a thick bulb; near the end it stretches round the ball
function wallR(x, t, g) {
  const dx = x - g.hx;
  const inner = Math.max(BORE, Math.abs(dx) < BALL ? Math.sqrt(BALL * BALL - dx * dx) + 2 : 0);
  return [inner, Math.max(RO + g.B * bump(t), inner + 18)];
}
// one half of the cut rivet (head + tube + squashed tail); sgn 1 = top, -1 = bottom
function tubeHalf(g, sgn) {
  const Y = r => f1(CY - sgn * r);
  const x0 = FL0 + g.ins, x1 = FS0 + g.ins;
  let d = `M${f1(x0)} ${Y(BORE)} L${f1(x0)} ${Y(FLR - 10)} Q${f1(x0)} ${Y(FLR)} ${f1(x0 + 10)} ${Y(FLR)} L${f1(x1)} ${Y(FLR)} L${f1(x1)} ${Y(RO)}`;
  const pts = [];
  for (let k = 0; k <= 40; k++) { const t = k / 40, x = g.xS + t * g.tail; pts.push([x, ...wallR(x, t, g)]); }
  pts.forEach(([x, , ro]) => d += ` L${f1(x)} ${Y(ro)}`);
  for (let k = pts.length - 1; k >= 0; k--) d += ` L${f1(pts[k][0])} ${Y(pts[k][1])}`;
  return d + ' Z';
}
function stemPath(dx, broken) {
  const L = STEM_L + dx, R = NECK_X + dx;
  let d = `M${f1(L + 8)} ${CY - STEM} L${f1(R - 8)} ${CY - STEM} L${f1(R)} ${CY - NECK}`;
  d += broken ? ` L${f1(R + 4)} ${CY - 4} L${f1(R - 2)} ${CY + 2} L${f1(R + 3)} ${CY + NECK}` : ` L${f1(R)} ${CY + NECK}`;
  return d + ` L${f1(R - 8)} ${CY + STEM} L${f1(L + 8)} ${CY + STEM} Q${f1(L)} ${CY + STEM} ${f1(L)} ${CY + STEM - 8} L${f1(L)} ${CY - STEM + 8} Q${f1(L)} ${CY - STEM} ${f1(L + 8)} ${CY - STEM} Z`;
}
function neckPath(dx, broken) {
  const L = NECK_X + dx, R = HX0 - BALL + 6 + dx;
  return broken
    ? `M${f1(L + 4)} ${CY - NECK} L${f1(R)} ${CY - NECK} L${f1(R)} ${CY + NECK} L${f1(L + 3)} ${CY + NECK} L${f1(L - 2)} ${CY + 2} L${f1(L + 4)} ${CY - 4} Z`
    : `M${f1(L)} ${CY - NECK} L${f1(R)} ${CY - NECK} L${f1(R)} ${CY + NECK} L${f1(L)} ${CY + NECK} Z`;
}

// ---------- build the zoom view ----------
const zm = $('zoom');
const RIV = { fill: '#fcd34d', stroke: '#92400e', 'stroke-width': 3, 'stroke-linejoin': 'round' };
const STL = { fill: '#94a3b8', stroke: '#334155', 'stroke-width': 2.5, 'stroke-linejoin': 'round' };
const blindTint = el('rect', { y: 484, width: 1600, height: 314, fill: '#334155', 'fill-opacity': 0.13 }, zm);
el('text', { x: 745, y: 504, 'text-anchor': 'end', 'font-size': 15, 'font-weight': 'bold', fill: '#334155' }, zm).textContent = 'outside ✋';
el('text', { x: 1552, y: 504, 'text-anchor': 'end', 'font-size': 15, 'font-weight': 'bold', fill: '#334155' }, zm).textContent = 'inside the box 🙈';

// riveter: back half (body + cavity), then the stem, then jaws and nose on top
const toolBack = el('g', {}, zm);
el('rect', { x: -300, y: CY - 120, width: 926, height: 240, rx: 18, fill: 'url(#pCut)', stroke: '#7f1d1d', 'stroke-width': 3 }, toolBack);
el('path', { d: `M150 ${CY - 75} L500 ${CY - 75} L626 ${CY - 40} L626 ${CY + 40} L500 ${CY + 75} L150 ${CY + 75} Z`, fill: '#fff1f2', stroke: '#7f1d1d', 'stroke-width': 2 }, toolBack);
el('text', { x: 380, y: CY + 150, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 'bold', fill: '#991b1b' }, toolBack).textContent = 'THE RIVETER (cut in half)';

const stem = el('path', STL, zm);

const toolFront = el('g', {}, zm);
const jawsG = el('g', {}, toolFront);
[-1, 1].forEach(sgn => {
  const Y = v => CY + sgn * v;
  el('rect', { x: 336, y: Math.min(Y(22), Y(60)), width: 200, height: 38, fill: '#cbd5e1', stroke: '#334155', 'stroke-width': 2 }, jawsG);
});
const jawTop = el('g', {}, jawsG), jawBot = el('g', {}, jawsG);
[[jawTop, -1], [jawBot, 1]].forEach(([g, sgn]) => {
  const Y = v => CY + sgn * v;
  let d = `M536 ${Y(62)} L606 ${Y(44)} L606 ${Y(22)}`;
  for (let x = 606; x > 536; x -= 10) d += ` L${x - 5} ${Y(STEM)} L${x - 10} ${Y(22)}`;
  el('path', { d: d + ' Z', fill: '#475569', stroke: '#0f172a', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
});
el('text', { x: 571, y: CY + 88, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 'bold', fill: '#fff' }, jawsG).textContent = 'jaws';
el('text', { x: 436, y: CY - 64, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 'bold', fill: '#7f1d1d' }, jawsG).textContent = '⬅ pulled by the handles';
el('rect', { x: 618, y: CY - 70, width: 32, height: 140, rx: 4, fill: '#64748b', stroke: '#1e293b', 'stroke-width': 2 }, toolFront);
[-1, 1].forEach(sgn => el('rect', { x: 640, y: sgn < 0 ? CY - 46 : CY + 22, width: 96, height: 24, rx: 4, fill: '#64748b', stroke: '#1e293b', 'stroke-width': 2 }, toolFront));
el('text', { x: 690, y: CY - 56, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#fff' }, toolFront).textContent = 'nose';

// sheets with a hole through both
[[FS0, '#93c5fd', '#1e3a8a', zm], [0, '#86efac', '#166534', null]].forEach(([x, fill, stroke, parent], k) => {
  const g = parent || el('g', { id: 'backSheet' }, zm);
  el('rect', { x, y: SH_T, width: SHW, height: CY - HOLE - SH_T, fill, stroke, 'stroke-width': 2.5 }, g);
  el('rect', { x, y: CY + HOLE, width: SHW, height: SH_B - CY - HOLE, fill, stroke, 'stroke-width': 2.5 }, g);
});

function makeRivet(parent) {
  return {
    top: el('path', RIV, parent), bot: el('path', RIV, parent),
    neck: el('path', STL, parent), ball: el('circle', { ...STL, r: BALL }, parent),
  };
}
const zr = makeRivet(zm);

const lbl = (attrs, text) => { const t = el('text', { 'font-size': 15, 'font-weight': 'bold', fill: '#334155', ...attrs }, zm); t.textContent = text; return t; };
const lblHead = lbl({ 'text-anchor': 'end', fill: '#92400e', y: CY - 88, 'font-size': 14 }, 'rivet head ➜');
const lblStem = lbl({ 'text-anchor': 'middle', y: CY + 46 }, 'steel stem');
const lblBall = lbl({ y: CY + 6 }, 'ball');
const lblBulb = lbl({ fill: '#92400e' }, 'bulb');
const lblGap = lbl({ 'text-anchor': 'middle', y: SH_B + 17, 'font-size': 14 }, 'gap');
const neckLine = el('line', { y1: CY + 12, y2: CY + 132, stroke: '#334155', 'stroke-width': 2, 'stroke-dasharray': '4 4' }, zm);
const lblNeck = lbl({ y: CY + 150 }, 'neck: the thin weak spot');
const snapPop = el('text', { 'text-anchor': 'middle', 'font-size': 34, 'font-weight': 'bold', fill: '#dc2626', stroke: '#fff', 'stroke-width': 5, 'paint-order': 'stroke', opacity: 0 }, zm);
snapPop.textContent = 'SNAP!';

// the same rivet, small, in the top picture
const tiny = $('tiny');
tiny.setAttribute('transform', `translate(700 245) scale(${TS}) translate(${-FS0} ${-CY})`);
const tinyStem = el('path', STL, tiny);
const tr = makeRivet(tiny);

// legend
(() => {
  const lg = $('legend'); let x = 520;
  [['#fcd34d', 'rivet'], ['#94a3b8', 'stem'], ['#93c5fd', 'front sheet'], ['#86efac', 'back sheet'], ['#f87171', 'riveter']].forEach(([c, t]) => {
    el('circle', { cx: x, cy: 460, r: 9, fill: c, stroke: '#334155', 'stroke-width': 1.5 }, lg);
    el('text', { x: x + 15, y: 466, 'font-size': 17, fill: '#334155' }, lg).textContent = t;
    x += 40 + t.length * 9.5;
  });
})();

// steps list
const STEPS = ['Push the rivet into the hole', 'Put the riveter on the stem', 'Squeeze, let go, squeeze again…', 'SNAP! The stem breaks off', 'Pull the riveter away'];
const stepRows = STEPS.map((t, k) => {
  const y = 128 + k * 34, g = el('g', {}, $('steps'));
  const bg = el('rect', { x: 1064, y: y - 16, width: 492, height: 32, rx: 10, fill: '#fef3c7', opacity: 0 }, g);
  const c = el('circle', { cx: 1090, cy: y, r: 14, fill: '#e2e8f0' }, g);
  const n = el('text', { x: 1090, y: y + 6, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 'bold', fill: '#475569' }, g);
  const tx = el('text', { x: 1114, y: y + 6, 'font-size': 18, fill: '#334155' }, g);
  n.textContent = k + 1; tx.textContent = t;
  return { bg, c, n, tx, k };
});

// ---------- state ----------
const fresh = () => ({
  phase: 'start', insertT: 0, toolT: 0,
  h: 0, hLast: 0, dragging: false, auto: null, queued: false,
  pHead: 0, stemExtra: 0, snapped: false, grip: false, lastAct: '',
  F: 0, squeezes: 0, snapT: 0, kick: 0, wiggleT: 0, clock: 0,
});
const S = { ...fresh(), slow: false };

function snap() { S.snapped = true; S.phase = 'snapped'; S.snapT = 1; S.kick = 1; }

function step(dt) {
  S.clock += dt;
  if (S.phase === 'insert') { S.insertT = Math.min(1, S.insertT + dt / 1.1); if (S.insertT >= 1) S.phase = 'inserted'; }
  if (S.phase === 'toolOn') { S.toolT = Math.min(1, S.toolT + dt / 1.1); if (S.toolT >= 1) S.phase = 'ready'; }
  if (S.phase === 'remove') { S.toolT = Math.max(0, S.toolT - dt / 1.2); if (S.toolT <= 0) S.phase = 'done'; }

  // handle: dragged, auto-squeezed by the button, or sprung back open
  if (S.auto !== null) {
    S.auto += dt; const t = S.auto;
    S.h = t < 0.45 ? ease(t / 0.45) : t < 0.6 ? 1 : t < 1.05 ? 1 - ease((t - 0.6) / 0.45) : 0;
    if (t >= 1.05) { S.auto = S.queued ? 0 : null; S.queued = false; }
  } else if (!S.dragging) S.h = Math.max(0, S.h - 2.5 * dt);

  // squeezing pulls the jaws back; they bite and drag the stem. Opening slides them forward over it.
  const dj = (S.h - S.hLast) * STROKE;
  const onStem = S.toolT >= 1 && (S.phase === 'ready' || S.phase === 'snapped');
  if (dj > 0.001) S.lastAct = 'grip'; else if (dj < -0.001) S.lastAct = 'release';
  S.grip = dj > 0.001 && onStem;
  if (S.grip) {
    if (S.phase === 'ready') {
      S.pHead += dj;
      if (S.pHead >= PSNAP) { S.stemExtra += S.pHead - PSNAP + 14; S.pHead = PSNAP; snap(); }
    } else S.stemExtra = Math.min(260, S.stemExtra + dj);
  }
  if (onStem && S.hLast < 0.85 && S.h >= 0.85) S.squeezes++;
  S.hLast = S.h;

  const pulling = S.phase === 'ready' && S.h > 0.02 && S.lastAct === 'grip';
  S.F += ((pulling ? pullForce(S.pHead) : 0) - S.F) * Math.min(1, 10 * dt);
  if (S.snapped && S.snapT === 1) S.F = 0;
  S.snapT = Math.max(0, S.snapT - dt * 0.9);
  S.kick = Math.max(0, S.kick - dt * 3);
  S.wiggleT = Math.max(0, S.wiggleT - dt);
}

function pullForce(p) {
  const q = p - E;
  if (q <= 0) return 0.1 + 0.1 * p / E;
  if (q <= A) return 0.2 + 0.2 * q / A;
  if (q <= A + G0) return 0.4 + 0.15 * (q - A) / G0;
  return 0.55 + 0.45 * Math.pow((q - A - G0) / T, 1.6);
}

function geom() {
  const ins = -(1 - ease(S.insertT)) * INS;
  const toolX = -(1 - ease(S.toolT)) * TOOL_OFF;
  const p = S.pHead, q = Math.max(0, p - E);
  const gap = G0 - clamp(q - A, 0, G0);
  const tail = q <= A ? TAIL0 - q : q <= A + G0 ? TAIL1 : TAIL1 - (q - A - G0);
  const xT = XT0 - q + ins;
  const hx = p <= E ? HX0 - p + ins : xT + 8;
  let wx = 0, wy = 0;
  if (S.wiggleT > 0) {
    const env = Math.min(1, S.wiggleT * 2.5), t = S.clock * 14;
    wx = -gap * (0.5 - 0.5 * Math.cos(t)) * env;
    wy = (S.insertT > 0 ? 0 : 20) * Math.sin(t * 0.8) * env;
  }
  return { ins, toolX, p, q, gap, tail, xT, xS: xT - tail, hx, B: 0.47 * (TAIL0 - tail), BS0: FS1 + gap + wx, wy, headDX: hx - HX0 };
}

// ---------- drawing ----------
const setT = (e, t) => e.setAttribute('transform', t);
let lastMsg = '', lastGlow = null;
const MAIN = {
  start: ['📌 push the rivet in', '#eab308'], insert: ['pushing it in…', null],
  inserted: ['🔧 put the riveter on', '#ef4444'], toolOn: ['sliding it on…', null],
  ready: ['✊ SQUEEZE!', '#dc2626'], snapped: ['↩ pull the riveter away', '#22c55e'],
  remove: ['pulling it away…', null], done: ['↺ do it again', '#6366f1'],
};

function render(g) {
  const shake = S.kick * 7 * Math.sin(S.clock * 70);

  // rivet + stem, big and small
  const broken = S.snapped;
  const stemDX = g.headDX - S.stemExtra + (S.snapped ? g.toolX : 0);
  [zr, tr].forEach(r => {
    r.top.setAttribute('d', tubeHalf(g, 1));
    r.bot.setAttribute('d', tubeHalf(g, -1));
    r.neck.setAttribute('d', neckPath(g.headDX, broken));
    r.ball.setAttribute('cx', f1(g.hx)); r.ball.setAttribute('cy', CY);
  });
  stem.setAttribute('d', stemPath(stemDX, broken));
  tinyStem.setAttribute('d', stemPath(stemDX, broken));
  tinyStem.setAttribute('opacity', S.snapped && S.toolT < 0.98 ? 0 : 1);

  // sheets
  setT($('backSheet'), `translate(${f1(g.BS0)} ${f1(g.wy)})`);
  blindTint.setAttribute('x', f1(g.BS0 + SHW));
  setT($('plateB'), `translate(${f1((g.BS0 - FS1) * TS)} ${f1(g.wy * TS)})`);

  // riveter
  const tx = g.toolX + shake;
  setT(toolBack, `translate(${f1(tx)} 0)`);
  setT(toolFront, `translate(${f1(tx)} 0)`);
  setT(jawsG, `translate(${f1(-S.h * STROKE)} 0)`);
  const open = S.grip || (S.h > 0.02 && S.lastAct === 'grip') ? 0 : 4;
  setT(jawTop, `translate(0 ${-open})`); setT(jawBot, `translate(0 ${open})`);
  const tipX = 700 + (FL0 - FS0 + tx) * TS;
  setT($('bigTool'), `translate(${f1(tipX)} 245)`);
  setT($('bigHandle'), `rotate(${f1(S.h * 38)} -70 20)`);
  const glow = S.grip && S.phase === 'ready';
  if (glow !== lastGlow) {
    [stem, jawTop, jawBot].forEach(e => glow ? e.setAttribute('filter', 'url(#glow)') : e.removeAttribute('filter'));
    lastGlow = glow;
  }

  // labels
  lblHead.setAttribute('x', f1(FL0 + g.ins - 6));
  lblStem.setAttribute('x', f1(560 + g.ins)); lblStem.setAttribute('opacity', S.toolT < 0.05 && !S.snapped ? 1 : 0);
  lblBall.setAttribute('x', f1(g.hx + BALL + 8));
  lblBulb.setAttribute('x', f1(g.xS + 8)); lblBulb.setAttribute('y', f1(CY - RO - g.B - 10));
  lblBulb.setAttribute('opacity', g.B > 12 ? 1 : 0);
  lblGap.setAttribute('x', f1(FS1 + g.gap / 2)); lblGap.setAttribute('opacity', g.gap > 5 ? 1 : 0);
  const nx = NECK_X + g.headDX;
  neckLine.setAttribute('x1', f1(nx)); neckLine.setAttribute('x2', f1(nx));
  lblNeck.setAttribute('x', f1(nx + 10));
  [neckLine, lblNeck].forEach(e => e.setAttribute('opacity', S.insertT >= 1 ? 1 : 0));
  lblNeck.textContent = S.snapped ? '💥 it broke here' : 'neck: the thin weak spot';
  snapPop.setAttribute('opacity', S.snapT.toFixed(2));
  setT(snapPop, `translate(${f1(nx)} ${CY - 70}) scale(${(1 + (1 - S.snapT) * 0.8).toFixed(2)})`);
  const bp = $('bigPop');
  bp.setAttribute('opacity', S.snapT.toFixed(2));
  setT(bp, `translate(${f1(tipX + 20)} 205) scale(${(1 + (1 - S.snapT) * 0.6).toFixed(2)})`);

  // panel: steps, button, pull meter
  const cur = stepIndex(g);
  stepRows.forEach(r => {
    const done = r.k < cur, now = r.k === cur;
    r.bg.setAttribute('opacity', now ? 1 : 0);
    r.c.setAttribute('fill', done ? '#22c55e' : now ? '#f59e0b' : '#e2e8f0');
    r.n.setAttribute('fill', done || now ? '#fff' : '#475569');
    r.n.textContent = done ? '✓' : r.k + 1;
    r.tx.setAttribute('font-weight', now ? 'bold' : 'normal');
  });
  const [mt, mc] = MAIN[S.phase];
  $('mainText').textContent = mt;
  $('mainRect').setAttribute('fill', mc || '#cbd5e1');
  $('mainText').setAttribute('fill', mc ? '#fff' : '#64748b');
  $('mainBtn').style.cursor = mc ? 'pointer' : 'default';
  $('forceBar').setAttribute('width', f1(Math.max(0, S.F) * 400));
  $('forceBar').setAttribute('fill', S.F < 0.4 ? '#22c55e' : S.F < 0.6 ? '#f59e0b' : '#ef4444');
  $('sqCount').textContent = 'squeezes: ' + S.squeezes;
  $('status').textContent = status(g);

  const [emo, text, color] = message(g);
  if (emo + text !== lastMsg) {
    $('msgEmo').textContent = emo; $('msgText').innerHTML = text;
    $('msg').style.borderColor = color; lastMsg = emo + text;
  }
}

function stepIndex(g) {
  switch (S.phase) {
    case 'start': case 'insert': return 0;
    case 'inserted': case 'toolOn': return 1;
    case 'ready': return g.q > A + G0 ? 3 : 2;
    case 'snapped': case 'remove': return 4;
  }
  return 5;
}

function status(g) {
  if (S.snapped) return 'Rivet: SET ✔ the sheets are held tight';
  switch (S.phase) {
    case 'start': return 'Rivet: not in the hole yet';
    case 'insert': return 'Rivet: going in…';
    case 'inserted': case 'toolOn': return 'Rivet: in the hole, but still loose';
  }
  if (g.p === 0) return 'Rivet: ready to squeeze';
  if (g.q <= A) return 'Rivet: tail squashing into a bulb';
  if (g.q <= A + G0) return 'Rivet: pulling the sheets together';
  return 'Rivet: tight! about to snap…';
}

function message(g) {
  if (S.wiggleT > 0) {
    if (S.snapped) return ['🪨', '<b>Wiggle test: rock solid!</b> The rivet head on the front and the bulb on the back clamp the sheets together. They can\'t slide or rattle.', '#22c55e'];
    if (S.insertT === 0) return ['🤝', '<b>Wiggle test:</b> with nothing holding them, the sheets <b>slide around</b> and rattle.', '#94a3b8'];
    if (g.gap > 1) return ['🤝', '<b>Wiggle test:</b> the rivet stops the sheets sliding, but they still <b>rattle</b>, because nothing squeezes them together yet.', '#94a3b8'];
    return ['🤏', '<b>Wiggle test:</b> nearly solid. Keep squeezing until the stem snaps!', '#f59e0b'];
  }
  switch (S.phase) {
    case 'start': return ['🧩', 'Two metal <b>sheets</b> with a hole drilled through both. We want to join them, but the back is <b>inside a closed box</b> and no hand fits in there. A <b>pop rivet</b> does the whole job from the front!', '#94a3b8'];
    case 'insert': case 'inserted': return ['📌', 'Push the <b>rivet</b> into the hole. Its flat <b>head</b> stops on the front sheet and its tail pokes out the back. A steel <b>stem</b> with a <b>ball</b> on the end runs right through it.', '#eab308'];
    case 'toolOn': return ['🔧', 'The riveter\'s <b>nose</b> slides over the stem and presses on the rivet head. Inside, little <b>jaws</b> with teeth wait to grab the stem.', '#ef4444'];
    case 'snapped': return ['💥', '<b>SNAP!</b> Once the rivet is tight, the stem breaks at its thin <b>neck</b>. The ball stays stuck inside, and the <b>bulb</b> holds the sheets from the back, where no hand could reach!', '#ef4444'];
    case 'remove': case 'done': return ['✅', '<b>Done!</b> The broken stem stays inside the riveter (tip it into the bin). Try the <b>wiggle test</b>: the sheets can\'t move now.', '#22c55e'];
  }
  if (g.p === 0) return ['✊', 'Ready! Now <b>squeeze the handles</b>: drag the black handle, or press the button or the space bar.', '#ef4444'];
  if (S.lastAct === 'release') return ['🔁', '<b>Let go:</b> a spring opens the handles and the jaws <b>slide forward</b> along the stem to take a new bite. The stem stays where it is. Squeeze again!', '#3b82f6'];
  if (g.q <= A) return ['💪', '<b>Squeeze:</b> the jaws <b>bite</b> the stem and pull it back. The <b>ball</b> gets dragged into the rivet\'s tail and squashes it into a fat <b>bulb</b>.', '#f97316'];
  if (g.q <= A + G0) return ['🤏', 'The bulb is pushing on the back sheet now. It pulls the two sheets <b>together</b> until the gap is gone.', '#f97316'];
  return ['😬', '<b>Tight!</b> The sheets can\'t squash any more, so the pull gets <b>harder and harder</b>. The stem has a thin weak spot called the <b>neck</b>…', '#ef4444'];
}

// ---------- input ----------
function mainAction() {
  switch (S.phase) {
    case 'start': S.phase = 'insert'; break;
    case 'inserted': S.phase = 'toolOn'; break;
    case 'ready': S.dragging = false; if (S.auto === null) S.auto = 0; else S.queued = true; break;
    case 'snapped': S.phase = 'remove'; break;
    case 'done': reset(); break;
  }
}
function reset() { const slow = S.slow; Object.assign(S, fresh(), { slow }); }
function toggleSlow() {
  S.slow = !S.slow;
  $('slowRect').setAttribute('fill', S.slow ? '#fde68a' : '#e2e8f0');
  $('slowText').textContent = S.slow ? '🐢 slow-mo ON' : '🐢 slow-mo';
}
const wiggle = () => { S.wiggleT = 1.6; };

const svg = $('svg');
function svgPt(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const handle = $('bigHandle');
function dragTo(e) {
  const p = svgPt(e), tip = 700 + (FL0 - FS0 + geom().toolX) * TS;
  const ang = Math.atan2(p.y - 265, p.x - (tip - 70)) * 180 / Math.PI;
  S.h = clamp((ang - 111.4) / 38, 0, 1);
}
handle.addEventListener('pointerdown', e => {
  S.dragging = true; S.auto = null; S.queued = false;
  handle.setPointerCapture(e.pointerId); dragTo(e); e.preventDefault();
});
handle.addEventListener('pointermove', e => { if (S.dragging) dragTo(e); });
const endDrag = () => { S.dragging = false; };
handle.addEventListener('pointerup', endDrag);
handle.addEventListener('pointercancel', endDrag);

$('mainBtn').addEventListener('click', mainAction);
$('slowBtn').addEventListener('click', toggleSlow);
$('wiggleBtn').addEventListener('click', wiggle);
$('resetBtn').addEventListener('click', reset);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'enter') { if (!e.repeat) mainAction(); e.preventDefault(); }
  else if (k === 's') toggleSlow();
  else if (k === 'w') wiggle();
  else if (k === 'r') reset();
});

window.__step = sec => { for (let t = 0; t < sec; t += 1 / 60) step(1 / 60); render(geom()); };

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.slow) dt *= 0.35;
  step(dt);
  render(geom());
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
