<script>
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = (v, p) => ((v % p) + p) % p;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const DEG = 180 / Math.PI;

// ---------- gearbox geometry (all gears share one tooth size) ----------
const M = 6.5;                        // tooth size; radius = teeth * M / 2
const rad = N => N * M / 2;
const YT_ = 570, C = 17 * M, YB_ = YT_ + C;   // engine shaft, wheel shaft
const X1 = 560, X2 = 865, XRV = 1005;         // engine gears: 1st, 2nd, reverse
const RATIO = { '1': 10 / 24, '2': 1, 'R': -10 / 18 };

// helper (idler) gear sits where it touches both reverse gears
const dT = rad(10) + rad(12), dB = rad(18) + rad(12);
const iyOff = (dT * dT - dB * dB + C * C) / (2 * C), ixOff = Math.sqrt(dT * dT - iyOff * iyOff);
const IDLER_IN = { x: XRV + ixOff, y: YT_ + iyOff }, IDLER_OUT = { x: XRV + ixOff + 70, y: YT_ + iyOff };
const aTI = Math.atan2(iyOff, ixOff), aIB = Math.atan2(C - iyOff, -ixOff);

// sliding collar between the 1st and 2nd wheel-shaft gears
// the big + small gears are one piece that slides along the wheel shaft (pushed by the shift fork)
const SLIDE = 65;                              // how far the piece slides each way from neutral
const XC0 = (X1 + X2) / 2;                     // middle of the piece in neutral
const SPAN = X2 - X1 - 2 * SLIDE;              // big gear centre to small gear centre
const FORK_DX = rad(24) + 0.85 * M + (SPAN - rad(24) - rad(17) - 1.7 * M) / 2;  // fork sits in the gap between them

// phase so teeth of gear B sit in the gaps of gear A at contact direction alpha
function meshPhase(thA0, NA, alpha, NB) {
  const pA = 2 * Math.PI / NA, pB = 2 * Math.PI / NB;
  let d = wrap(thA0 - alpha, pA); if (d > pA / 2) d -= pA;
  return alpha + Math.PI - d * NA / NB - pB / 2;
}
const PH = {
  b1: meshPhase(0, 10, Math.PI / 2, 24),
  b2: meshPhase(0, 17, Math.PI / 2, 17),
};
PH.idler = meshPhase(0, 10, aTI, 12);
PH.bR = meshPhase(PH.idler, 12, aIB, 18);

function gearPath(N) {
  const r = rad(N), ra = r + 0.85 * M, rr = r - 1.1 * M, p = 2 * Math.PI / N;
  let d = '';
  for (let k = 0; k < N; k++) {
    const a = k * p;
    [[rr, a - 0.29 * p], [ra, a - 0.13 * p], [ra, a + 0.13 * p], [rr, a + 0.29 * p]].forEach(([R, A], j) => {
      d += (k === 0 && j === 0 ? 'M' : 'L') + (R * Math.cos(A)).toFixed(2) + ' ' + (R * Math.sin(A)).toFixed(2) + ' ';
    });
  }
  return d + 'Z';
}

const COL = {
  engine: ['#60a5fa', '#1e3a8a'], wheel: ['#86efac', '#166534'],
  loose: ['#c4b5fd', '#5b21b6'], helper: ['#fdba74', '#9a3412'],
};
function makeGear(parent, N, x, y, team) {
  const r = rad(N), rr = r - 1.1 * M;
  const g = el('g', { transform: `translate(${x} ${y})` }, parent);
  const rot = el('g', {}, g);
  const body = el('path', { d: gearPath(N), fill: COL[team][0], stroke: COL[team][1], 'stroke-width': 3, 'stroke-linejoin': 'round' }, rot);
  el('circle', { r: rr - 5, fill: '#fff', 'fill-opacity': 0.3 }, rot);
  if (N >= 14) for (let k = 0; k < 5; k++) {
    const a = k * 2 * Math.PI / 5;
    el('circle', { cx: 0.5 * r * Math.cos(a), cy: 0.5 * r * Math.sin(a), r: 0.12 * r, fill: '#fff', 'fill-opacity': 0.75, stroke: COL[team][1], 'stroke-width': 2 }, rot);
  }
  el('circle', { cx: rr - 9, cy: 0, r: 7, fill: '#facc15', stroke: '#713f12', 'stroke-width': 2.5 }, rot);
  el('circle', { r: 12, fill: COL[team][1] }, g);
  const ring = el('circle', { r: 17, fill: 'none', stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '4 4', display: team === 'loose' ? 'inline' : 'none' }, g);
  const lock = el('text', { y: 8, 'text-anchor': 'middle', 'font-size': 24, display: 'none' }, g);
  lock.textContent = '🔒';
  return { g, rot, body, ring, lock, N, team };
}

// ---------- build gearbox ----------
const gb = $('gbox');
el('rect', { x: 395, y: 497, width: 895, height: 290, rx: 26, fill: '#eef2ff', 'fill-opacity': 0.7, stroke: '#6366f1', 'stroke-width': 3, 'stroke-dasharray': '12 7' }, gb);
[[X1, '1st: small turns BIG'], [X2, '2nd: same size'], [XRV + 60, 'Reverse: + helper gear']].forEach(([x, t]) => {
  el('text', { x, y: 489, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 'bold', fill: '#4338ca' }, gb).textContent = t;
});
el('text', { x: 405, y: 553, 'font-size': 13, 'font-weight': 'bold', fill: '#1e3a8a' }, gb).textContent = 'engine shaft';
el('text', { x: 405, y: 716, 'font-size': 13, 'font-weight': 'bold', fill: '#334155' }, gb).textContent = 'wheel shaft';
const shaftNote = el('text', { x: 1300, y: YB_ - 20, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#64748b' }, gb);
el('rect', { x: 312, y: YT_ - 7, width: XRV + 30 - 312, height: 14, fill: 'url(#pInput)', stroke: '#1e3a8a', 'stroke-width': 2 }, gb);
const wheelShaft = el('rect', { x: 470, y: YB_ - 11, width: 1450 - 470, height: 22, rx: 4, fill: 'url(#pWheel)', stroke: '#334155', 'stroke-width': 2 }, gb);
el('line', { x1: IDLER_IN.x - 22, y1: 520, x2: IDLER_OUT.x + 22, y2: 520, stroke: '#cbd5e1', 'stroke-width': 8, 'stroke-linecap': 'round' }, gb);
el('line', { x1: XC0 - SPAN / 2 + FORK_DX - SLIDE - 30, y1: 772, x2: XC0 - SPAN / 2 + FORK_DX + SLIDE + 30, y2: 772, stroke: '#cbd5e1', 'stroke-width': 8, 'stroke-linecap': 'round' }, gb);

const sleeve = el('rect', { x: 0, y: YB_ - 15, width: SPAN, height: 30, rx: 6, fill: 'url(#pCollar)', stroke: '#14532d', 'stroke-width': 3 }, gb);
const G = {
  b1: makeGear(gb, 24, X1 + SLIDE, YB_, 'wheel'),
  b2: makeGear(gb, 17, X2 - SLIDE, YB_, 'wheel'),
  bR: makeGear(gb, 18, XRV, YB_, 'wheel'),
  t1: makeGear(gb, 10, X1, YT_, 'engine'),
  t2: makeGear(gb, 17, X2, YT_, 'engine'),
  tR: makeGear(gb, 10, XRV, YT_, 'engine'),
};

// helper gear with its fork
const idlerG = el('g', {}, gb);
el('line', { x1: 0, y1: 0, x2: 0, y2: 520 - IDLER_IN.y, stroke: '#f97316', 'stroke-width': 6 }, idlerG);
el('rect', { x: -14, y: 520 - IDLER_IN.y - 8, width: 28, height: 16, rx: 4, fill: '#f97316' }, idlerG);
G.idler = makeGear(idlerG, 12, 0, 0, 'helper');
const idlerLabel = el('text', { x: 48, y: -4, 'font-size': 14, 'font-weight': 'bold', fill: '#9a3412' }, idlerG);
idlerLabel.innerHTML = '<tspan x="48">helper</tspan><tspan x="48" dy="16">gear</tspan>';

// sliding collar with its fork
const forkG = el('g', {}, gb);
el('path', { d: `M -10 -22 L -10 22 M 10 -22 L 10 22 M 0 22 L 0 ${772 - YB_}`, stroke: '#f97316', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, forkG);
el('rect', { x: -14, y: 772 - YB_ - 8, width: 28, height: 16, rx: 4, fill: '#f97316' }, forkG);
const sliderParts = [sleeve, forkG];
el('text', { x: X2 + 20, y: 778, 'font-size': 14, 'font-weight': 'bold', fill: '#c2410c' }, gb).textContent = '← shift fork slides the gears (moved by the stick)';

const counter = el('g', { display: 'none' }, gb);
el('rect', { x: XC0 - 73, y: 500, width: 146, height: 48, rx: 10, fill: '#fff', stroke: '#facc15', 'stroke-width': 3 }, counter);
const cntTop = el('text', { x: XC0, y: 519, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#1e3a8a' }, counter);
const cntBot = el('text', { x: XC0, y: 540, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#166534' }, counter);

const clickPop = el('text', { 'text-anchor': 'middle', 'font-size': 26, 'font-weight': 'bold', fill: '#ea580c', stroke: '#fff', 'stroke-width': 4, 'paint-order': 'stroke', opacity: 0 }, gb);
clickPop.textContent = 'click!';

// output to the wheels
const wheelIcon = el('g', { transform: `translate(1450 ${YB_})` }, gb);
el('circle', { r: 62, fill: '#1f2937' }, wheelIcon);
const wheelIconRot = el('g', {}, wheelIcon);
el('circle', { r: 38, fill: '#e2e8f0' }, wheelIconRot);
for (let k = 0; k < 5; k++) {
  const a = k * 2 * Math.PI / 5;
  el('line', { x2: 34 * Math.cos(a), y2: 34 * Math.sin(a), stroke: '#64748b', 'stroke-width': 7, 'stroke-linecap': 'round' }, wheelIconRot);
}
el('circle', { cx: 50, r: 7, fill: '#ef4444' }, wheelIconRot);
el('circle', { r: 9, fill: '#334155' }, wheelIconRot);
el('text', { x: 1450, y: YB_ - 76, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 'bold', fill: '#166534' }, gb).textContent = 'TO THE WHEELS';
const wheelDir = el('text', { x: 1450, y: YB_ + 92, 'text-anchor': 'middle', 'font-size': 18, 'font-weight': 'bold', fill: '#334155' }, gb);

// legend
(() => {
  const lg = $('legend'); let x = 560;
  [['#60a5fa', 'engine side'], ['#86efac', 'wheel side'], ['#fdba74', 'helper gear'], ['#facc15', 'power flowing']].forEach(([c, t]) => {
    el('circle', { cx: x, cy: 460, r: 9, fill: c, stroke: '#334155', 'stroke-width': 1.5 }, lg);
    el('text', { x: x + 15, y: 466, 'font-size': 17, fill: '#334155' }, lg).textContent = t;
    x += 40 + t.length * 9.5;
  });
})();

// scenery
const trees = [], clouds = [];
for (let i = 0; i < 5; i++) {
  const t = el('g', {}, $('trees'));
  el('rect', { x: -7, y: -45, width: 14, height: 45, fill: '#92400e' }, t);
  el('circle', { cy: -75, r: 36, fill: '#4ade80', stroke: '#166534', 'stroke-width': 3 }, t);
  trees.push(t);
}
for (let i = 0; i < 3; i++) {
  const c = el('g', {}, $('clouds'));
  [[0, 0, 30], [28, 6, 24], [-28, 8, 22]].forEach(([cx, cy, r]) => el('circle', { cx, cy, r, fill: '#fff' }, c));
  clouds.push(c);
}
for (let i = 0; i < 16; i++) el('rect', { x: i * 80, y: 401, width: 40, height: 6, rx: 3, fill: '#fff' }, $('roadDashes'));

// ---------- shifter gate (H pattern: 1 up-left, 2 down-left, R up-right) ----------
const XL = 1170, XR = 1330, XN = 1250, YT = 150, YN = 255, YB = 360;
const STOPS = { '1': { x: XL, y: YT }, '2': { x: XL, y: YB }, 'R': { x: XR, y: YT }, 'N': { x: XN, y: YN } };
const J1 = { x: XL, y: YN }, JR = { x: XR, y: YN };

function segsOf(p) {
  const s = [];
  if (Math.abs(p.x - XL) < 0.5 && p.y >= YT - 0.5 && p.y <= YB + 0.5) s.push('L');
  if (Math.abs(p.y - YN) < 0.5 && p.x >= XL - 0.5 && p.x <= XR + 0.5) s.push('N');
  if (Math.abs(p.x - XR) < 0.5 && p.y >= YT - 0.5 && p.y <= YN + 0.5) s.push('R');
  return s;
}
function nearestOnGate(p) {
  return [{ x: XL, y: clamp(p.y, YT, YB) }, { x: clamp(p.x, XL, XR), y: YN }, { x: XR, y: clamp(p.y, YT, YN) }]
    .reduce((a, b) => dist(a, p) <= dist(b, p) ? a : b);
}
// the stick can only travel along the slots, always through the neutral rail
function nextWaypoint(p, t) {
  const a = segsOf(p), b = segsOf(t);
  if (a.some(k => b.includes(k))) return t;
  if (a.includes('N')) return b.includes('L') ? J1 : JR;
  return a.includes('L') ? J1 : JR;
}
function snapStop(p) {
  if (Math.abs(p.x - XL) < 0.5 && Math.abs(p.y - YN) > 30) return { ...STOPS[p.y < YN ? '1' : '2'] };
  if (Math.abs(p.x - XR) < 0.5 && YN - p.y > 30) return { ...STOPS.R };
  return { ...STOPS.N };   // spring pulls it back to the middle
}
function linkage(p) {
  let c = 0, i = 0;
  if (Math.abs(p.x - XL) < 0.5) c = p.y < YN ? -(YN - p.y) / (YN - YT) : (p.y - YN) / (YB - YN);
  else if (Math.abs(p.x - XR) < 0.5 && p.y < YN) i = (YN - p.y) / (YN - YT);
  return { c, i };
}

// ---------- state ----------
const IDLE = 3.4;          // engine speed, radians per second (slow so you can see the teeth)
const WHEEL_R = 42;
const S = {
  engineOn: true, we: IDLE, wIn: IDLE, wOut: 0,
  thE: 0, thIn: 0, thWs: 0, thIdler: PH.idler,
  clutch: 1, holdT: 0, knob: { ...STOPS.N }, target: { ...STOPS.N }, dragging: false,
  gear: 'N', cnt0: null, clutchHeld: false, shaftTurning: null, blocked: false, slow: false, groundX: 0, clickT: 0, clickAt: { x: 0, y: 0 },
};

function moveKnob(dt) {
  let budget = (S.dragging ? 2400 : 330) * dt;
  for (let n = 0; n < 6 && budget > 1e-6; n++) {
    const w = nextWaypoint(S.knob, S.target);
    const d = dist(S.knob, w);
    if (d <= budget) { S.knob = { x: w.x, y: w.y }; budget -= d; if (w === S.target) break; }
    else { S.knob.x += (w.x - S.knob.x) * budget / d; S.knob.y += (w.y - S.knob.y) * budget / d; budget = 0; }
  }
  // no switching between forward and reverse while the car is still rolling
  const LIM = CATCH * 0.6, t = S.target;
  S.blocked = false;
  if (S.wOut > 0.05 && Math.abs(t.x - XR) < 0.5 && t.y < YN - 1) {
    S.blocked = true;
    if (Math.abs(S.knob.x - XR) < 0.5) S.knob.y = Math.max(S.knob.y, YN - LIM * (YN - YT));
  }
  if (S.wOut < -0.05 && Math.abs(t.x - XL) < 0.5 && Math.abs(t.y - YN) > 1) {
    S.blocked = true;
    if (Math.abs(S.knob.x - XL) < 0.5) S.knob.y = clamp(S.knob.y, YN - LIM * (YN - YT), YN + LIM * (YB - YN));
  }
}

// slide amount (0..1) at which the teeth first touch
const CATCH = 0.9 * (1 - (Math.sqrt((rad(24) + rad(10) + 1.7 * M) ** 2 - C * C) - 2) / SLIDE);
function step(dt) {
  const before = { ...S.knob };
  moveKnob(dt);
  S.holdT = (dist(before, S.knob) > 0.05 || S.dragging) ? 0.25 : Math.max(0, S.holdT - dt);

  const { c, i } = linkage(S.knob);
  const gear = c <= -CATCH ? '1' : c >= CATCH ? '2' : i >= 0.9 ? 'R' : 'N';
  if (gear !== S.gear) {
    if (gear !== 'N') {
      S.clickT = 0.8;
      S.clickAt = gear === 'R' ? { x: IDLER_IN.x + 60, y: IDLER_IN.y - 42 } : { x: gear === '1' ? X1 + 105 : X2 - 105, y: YT_ + 35 };
    }
    S.gear = gear;
    S.cnt0 = gear === '1' || gear === '2' ? { tin: S.thIn, tws: S.thWs } : null;
  }
  S.clickT = Math.max(0, S.clickT - dt);

  S.we += ((S.engineOn ? IDLE : 0) - S.we) * Math.min(1, 2.5 * dt);
  const want = S.holdT > 0 || S.clutchHeld ? 0 : 1;
  const rate = want < S.clutch ? 6 : 1.4;     // press fast, let out gently
  S.clutch += clamp(want - S.clutch, -rate * dt, rate * dt);

  if (gear === 'N') {
    S.wIn += (S.we - S.wIn) * Math.min(1, 6 * S.clutch * dt) - S.wIn * (1 - S.clutch) * 2 * dt;
    S.wOut -= S.wOut * Math.min(1, dt * (S.blocked ? 4 : 0.9));
    if (Math.abs(S.wOut) < 0.004) S.wOut = 0;
  } else {
    // in gear the wheel shaft and engine shaft are locked together by the gear pair
    const R = RATIO[gear], k = S.clutch * S.clutch;
    S.wOut += (R * S.we - S.wOut) * Math.min(1, 1.3 * k * dt) - S.wOut * (1 - k) * 0.3 * dt;
    S.wIn = S.wOut / R;
  }

  S.thE += S.we * dt;
  S.thIn += S.wIn * dt;
  S.thWs += S.wOut * dt;
  if (gear === '1' || gear === '2') {
    // keep the engine gear's teeth in the gaps of the sliding gear (the gears are meshed)
    const R = RATIO[gear], pT = 2 * Math.PI / (gear === '1' ? 10 : 17), tgt = S.thWs / R;
    S.thIn = tgt + pT * Math.round((S.thIn - tgt) / pT);
  }
  if (gear === 'R') {
    const pB = 2 * Math.PI / 18, tgt = RATIO.R * S.thIn;
    S.thWs = tgt + pB * Math.round((S.thWs - tgt) / pB);
  }
  if (i >= 0.9) {
    const pI = 2 * Math.PI / 12, tgt = PH.idler + (10 / 12) * S.thIn;
    S.thIdler = tgt + pI * Math.round((S.thIdler - tgt) / pI);
  }
  S.groundX -= S.wOut * WHEEL_R * dt;
  return { c, i };
}

// ---------- drawing ----------
const setT = (e, t) => e.setAttribute('transform', t);
const stripes = (id, v) => $(id).setAttribute('patternTransform', `translate(0 ${wrap(v * 9, 16).toFixed(2)})`);
let lastMsg = '', lastGlow = '';

function render({ c, i }) {
  // engine
  const phi = -S.thE;
  setT($('crank'), `rotate(${(phi * DEG).toFixed(2)})`);
  [[1, 140, phi], [2, 190, phi + Math.PI]].forEach(([n, cx, a]) => {
    const px = 165 + 16 * Math.cos(a), py = 570 + 16 * Math.sin(a);
    const pinY = py - Math.sqrt(56 * 56 - (cx - px) ** 2);
    $('rod' + n).setAttribute('x1', px); $('rod' + n).setAttribute('y1', py);
    $('rod' + n).setAttribute('x2', cx); $('rod' + n).setAttribute('y2', pinY);
    $('pin' + n).setAttribute('cx', px); $('pin' + n).setAttribute('cy', py);
    $('piston' + n).setAttribute('y', pinY - 12);
    $('spark' + n).setAttribute('opacity', S.we > 1 ? clamp(1 - (pinY - 502) / 7, 0, 1) : 0);
  });
  stripes('pEngine', S.thE);
  stripes('pInput', S.thIn);
  stripes('pWheel', -S.thWs);
  stripes('pCollar', -S.thWs);
  const turning = Math.abs(S.wOut) > 0.05;
  if (turning !== S.shaftTurning) {
    S.shaftTurning = turning;
    $('pWheelBase').setAttribute('fill', turning ? '#f59e0b' : '#94a3b8');
    $('pWheelLine').setAttribute('stroke', turning ? '#92400e' : '#64748b');
    wheelShaft.setAttribute('stroke', turning ? '#92400e' : '#334155');
    $('carAxle').setAttribute('stroke', turning ? '#f59e0b' : '#94a3b8');
    shaftNote.textContent = turning ? 'turning ➜' : 'not turning';
    shaftNote.setAttribute('fill', turning ? '#c2410c' : '#64748b');
  }

  // clutch
  setT($('clutchDisc'), `translate(${((1 - S.clutch) * 18).toFixed(2)} 0)`);
  $('clutchState').textContent = S.clutch > 0.95 ? 'joined ✔' : 'apart ✋';

  // gears
  const rot = (g, a) => setT(g.rot, `rotate(${(a * DEG).toFixed(2)})`);
  rot(G.t1, -S.thIn); rot(G.t2, -S.thIn); rot(G.tR, -S.thIn);
  rot(G.b1, PH.b1 + S.thWs);
  rot(G.b2, PH.b2 + S.thWs);
  rot(G.bR, PH.bR + S.thWs);
  rot(G.idler, S.thIdler);

  // collar and helper gear follow the stick
  const off = Math.sign(c) * Math.min(1, Math.abs(c) / 0.9) * SLIDE;
  const bigX = X1 + SLIDE + off;
  setT(G.b1.g, `translate(${bigX.toFixed(2)} ${YB_})`);
  setT(G.b2.g, `translate(${(bigX + SPAN).toFixed(2)} ${YB_})`);
  sleeve.setAttribute('x', bigX.toFixed(2));
  setT(forkG, `translate(${(bigX + FORK_DX).toFixed(2)} ${YB_})`);
  const f = Math.min(1, i / 0.9);
  setT(idlerG, `translate(${(IDLER_OUT.x + (IDLER_IN.x - IDLER_OUT.x) * f).toFixed(2)} ${IDLER_IN.y})`);

  // power path glow
  const live = S.gear !== 'N' && S.clutch > 0.6 && S.we > 0.5;
  const glowKey = live ? S.gear : '';
  if (glowKey !== lastGlow) {
    const on = { '1': [G.t1.g, G.b1.g, sleeve], '2': [G.t2.g, G.b2.g, sleeve], 'R': [G.tR.g, G.idler.g, G.bR.g] }[glowKey] || [];
    [G.t1.g, G.b1.g, G.t2.g, G.b2.g, G.tR.g, G.bR.g, G.idler.g, sleeve, wheelIcon].forEach(e => e.removeAttribute('filter'));
    on.concat(on.length ? [wheelIcon] : []).forEach(e => e.setAttribute('filter', 'url(#glow)'));
    lastGlow = glowKey;
  }

  // count turns of the working gear pair (1st: about 12 small turns for 5 big ones)
  if (S.cnt0) {
    counter.setAttribute('display', 'inline');
    const tin = Math.floor((S.thIn - S.cnt0.tin) / (2 * Math.PI)), tws = Math.floor((S.thWs - S.cnt0.tws) / (2 * Math.PI));
    cntTop.textContent = (S.gear === '1' ? 'small gear: ' : 'top gear: ') + tin + (tin === 1 ? ' turn' : ' turns');
    cntBot.textContent = (S.gear === '1' ? 'BIG gear: ' : 'bottom gear: ') + tws + (tws === 1 ? ' turn' : ' turns');
  } else counter.setAttribute('display', 'none');

  clickPop.setAttribute('opacity', (S.clickT / 0.8).toFixed(2));
  const sc = 1 + (0.8 - S.clickT) * 0.6;
  setT(clickPop, `translate(${S.clickAt.x} ${S.clickAt.y}) scale(${sc.toFixed(2)})`);

  setT(wheelIconRot, `rotate(${(S.thWs * DEG).toFixed(2)})`);
  const v = S.wOut / IDLE;
  wheelDir.textContent = Math.abs(v) < 0.01 ? '⏸ not turning' : v > 0 ? 'turning: FORWARD ➡' : '⬅ turning: BACKWARD';

  // car
  document.querySelectorAll('.carWheel').forEach(w => setT(w, `rotate(${(S.thWs * DEG).toFixed(2)})`));
  trees.forEach((t, k) => setT(t, `translate(${(wrap(k * 250 + S.groundX, 1250) - 100).toFixed(1)} 388)`));
  clouds.forEach((cl, k) => setT(cl, `translate(${(wrap(k * 400 + 120 + S.groundX * 0.15, 1200) - 100).toFixed(1)} ${100 + k * 22})`));
  setT($('roadDashes'), `translate(${(wrap(S.groundX, 80) - 80).toFixed(1)} 0)`);
  const fwd = S.knob.y < YN ? (YN - S.knob.y) / (YN - YT) : -(S.knob.y - YN) / (YB - YN);
  setT($('carStick'), `rotate(${(fwd * 24).toFixed(2)} 590 330)`);
  $('carStatus').textContent = S.blocked && Math.abs(v) > 0.01 ? 'Car: braking 🛑'
    : Math.abs(v) < 0.01 ? 'Car: stopped'
    : v < 0 ? 'Car: going BACKWARD ⬅'
    : v < 0.6 ? 'Car: going forward, slowly 🐢' : 'Car: going forward, faster 🐇';

  // shifter
  setT($('knob'), `translate(${S.knob.x.toFixed(2)} ${S.knob.y.toFixed(2)})`);
  $('stickLine').setAttribute('x2', S.knob.x); $('stickLine').setAttribute('y2', S.knob.y);
  const big = $('gearBig');
  big.textContent = S.gear;
  big.setAttribute('fill', { N: '#94a3b8', '1': '#22c55e', '2': '#16a34a', R: '#f97316' }[S.gear]);

  // engine button
  $('engRect').setAttribute('fill', S.engineOn ? '#22c55e' : '#ef4444');
  $('engRect').setAttribute('stroke', S.engineOn ? '#14532d' : '#7f1d1d');
  $('engText').textContent = S.engineOn ? '🔑 ENGINE: ON' : '🔑 ENGINE: OFF';

  // explanation
  const [emo, text, color] = message(v);
  const key = emo + text;
  if (key !== lastMsg) {
    $('msgEmo').textContent = emo; $('msgText').innerHTML = text;
    $('msg').style.borderColor = color; lastMsg = key;
  }
}

function message(v) {
  if (!S.engineOn && S.we < 0.3)
    return ['🔑', 'The engine is <b>OFF</b>, so nothing spins, not even in gear. Press the <b>ENGINE</b> button to start it!', '#94a3b8'];
  if (S.blocked)
    return ['✋', '<b>WAIT!</b> The car is still rolling the other way. You have to <b>stop</b> before switching between forward and reverse. Braking…', '#ef4444'];
  if (S.clutchHeld)
    return ['🦶', '<b>CLUTCH HELD DOWN:</b> the engine is <b>not connected</b> to the gearbox. Change gear now, then let go of the clutch to drive.', '#3b82f6'];
  if (S.clutch < 0.97 && (S.holdT > 0 || S.dragging))
    return ['🦶', '<b>CLUTCH PRESSED:</b> the engine lets go of the gearbox for a moment, so the gears can slide together without a crunch.', '#3b82f6'];
  switch (S.gear) {
    case '1': return ['1️⃣', '<b>1st GEAR:</b> the shift fork slides the <b>BIG gear</b> along the wheel shaft until its teeth catch the small engine gear. Small gear turning a big gear = slow but strong. Great for starting!', '#22c55e'];
    case '2': return ['2️⃣', '<b>2nd GEAR:</b> the fork slides the gears the other way, so the <b>same-size</b> gears catch. Now the wheels spin as fast as the engine. Faster!', '#16a34a'];
    case 'R': return ['🔙', '<b>REVERSE:</b> a little <b>helper gear</b> slides in between. One extra gear flips the spin, so the wheels turn the other way. Backwards!', '#f97316'];
  }
  return ['😴', '<b>NEUTRAL:</b> the engine runs and the blue gears spin, but the green gears on the wheel shaft are <b>not touching</b> them. Nothing turns the wheels.' +
    (Math.abs(v) > 0.01 ? ' The car rolls to a stop.' : ' The car stays still.'), '#94a3b8'];
}

// ---------- input ----------
const svg = $('svg');
function svgPt(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
const knob = $('knob');
knob.addEventListener('pointerdown', e => {
  S.dragging = true; knob.setPointerCapture(e.pointerId);
  S.target = nearestOnGate(svgPt(e)); e.preventDefault();
});
knob.addEventListener('pointermove', e => { if (S.dragging) S.target = nearestOnGate(svgPt(e)); });
const endDrag = () => { if (!S.dragging) return; S.dragging = false; S.target = snapStop(S.target); };
knob.addEventListener('pointerup', endDrag);
knob.addEventListener('pointercancel', endDrag);

function shiftTo(g) { S.dragging = false; S.target = { ...STOPS[g] }; }
function toggleEngine() { S.engineOn = !S.engineOn; }
function toggleClutch() {
  S.clutchHeld = !S.clutchHeld;
  $('clutchRect').setAttribute('fill', S.clutchHeld ? '#3b82f6' : '#dbeafe');
  $('clutchText').setAttribute('fill', S.clutchHeld ? '#fff' : '#1e3a8a');
  $('clutchText').textContent = S.clutchHeld ? '🦶 let go' : '🦶 hold clutch';
}
function toggleSlow() {
  S.slow = !S.slow;
  $('slowRect').setAttribute('fill', S.slow ? '#fde68a' : '#e2e8f0');
  $('slowText').textContent = S.slow ? '🐢 slow-mo ON' : '🐢 slow-mo';
}
document.querySelectorAll('[data-gear]').forEach(b => b.addEventListener('click', () => shiftTo(b.dataset.gear)));
$('engBtn').addEventListener('click', toggleEngine);
$('slowBtn').addEventListener('click', toggleSlow);
$('clutchBtn').addEventListener('click', toggleClutch);
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === '1' || k === '2') shiftTo(k);
  else if (k === 'r') shiftTo('R');
  else if (k === 'n' || k === '0') shiftTo('N');
  else if (k === 'e' || k === ' ') { toggleEngine(); e.preventDefault(); }
  else if (k === 's') toggleSlow();
  else if (k === 'c') toggleClutch();
});

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (S.slow) dt *= 0.35;
  render(step(dt));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
